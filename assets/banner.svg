<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="t d">
<title id="t">Third Hand-Eye — Arduino obstacle alert</title>
<desc id="d">An Arduino Uno with an HC-SR04 ultrasonic sensor emits sound waves toward an obstacle; a buzzer beeps when the obstacle is within one metre.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05081a"/><stop offset="1" stop-color="#0b2a3a"/></linearGradient>
<linearGradient id="pcb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0891b2"/><stop offset="1" stop-color="#155e75"/></linearGradient>
<filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity=".55"/></filter>
<style>.t{font-family:'Segoe UI',Inter,Arial,sans-serif}
.w{fill:none;stroke:#22d3ee;stroke-width:3;opacity:0;animation:w 2s ease-out infinite}.w2{animation-delay:.5s}.w3{animation-delay:1s}
@keyframes w{0%{opacity:0;transform:translateX(0)}20%{opacity:1}100%{opacity:0;transform:translateX(120px)}}
.bz{animation:b 1s steps(2) infinite}@keyframes b{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.w{opacity:.7}}</style>
</defs>
<rect width="1000" height="260" rx="16" fill="url(#bg)"/>
<g filter="url(#sh)"><rect x="60" y="80" width="200" height="130" rx="10" fill="url(#pcb)"/>
<rect x="80" y="95" width="60" height="30" rx="3" fill="#cbd5e1"/><rect x="170" y="150" width="70" height="20" rx="3" fill="#0f172a"/>
<g fill="#facc15"><circle cx="100" cy="190" r="3"/><circle cx="115" cy="190" r="3"/><circle cx="130" cy="190" r="3"/><circle cx="145" cy="190" r="3"/><circle cx="160" cy="190" r="3"/></g>
<text x="160" y="130" fill="#e0f2fe" font-size="16" class="t" font-weight="700">UNO</text></g>
<g filter="url(#sh)"><rect x="280" y="110" width="90" height="50" rx="6" fill="#1d4ed8"/><circle cx="305" cy="135" r="16" fill="#cbd5e1" stroke="#64748b" stroke-width="4"/><circle cx="345" cy="135" r="16" fill="#cbd5e1" stroke="#64748b" stroke-width="4"/></g>
<path d="M260 140H280" stroke="#facc15" stroke-width="3"/>
<g transform="translate(380 135)"><path class="w" d="M0 -30Q20 0 0 30"/><path class="w w2" d="M0 -30Q20 0 0 30"/><path class="w w3" d="M0 -30Q20 0 0 30"/></g>
<rect x="520" y="85" width="40" height="110" rx="8" fill="#a855f7" filter="url(#sh)"/>
<g class="bz"><circle cx="160" cy="60" r="14" fill="#f43f5e"/><path d="M182 50q8 10 0 20M192 44q14 16 0 32" stroke="#f43f5e" stroke-width="3" fill="none"/></g>
<g class="t"><text x="610" y="110" font-size="36" font-weight="800" fill="#e2e8f0">Third Hand-Eye</text>
<text x="610" y="145" font-size="17" fill="#94a3b8">Ultrasonic obstacle alert for visually</text>
<text x="610" y="168" font-size="17" fill="#94a3b8">impaired users · Arduino Uno + HC-SR04</text>
<text x="610" y="205" font-size="15" fill="#22d3ee">beeps when an obstacle is ≤ 100 cm away</text></g>
</svg>
