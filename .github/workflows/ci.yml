name: CI
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and run host tests
        run: g++ -std=c++17 -Wall -Wextra -Werror tests/test_distance.cpp -o test_distance && ./test_distance
  compile-sketch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:uno
          sketch-paths: firmware/third_hand_eye
          enable-warnings-report: true
  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude "youtube.com|linkedin.com" README.md
          fail: true
